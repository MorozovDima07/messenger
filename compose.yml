services:
  postgres:
    image: postgres:17.4-alpine3.21
    container_name: psgr
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USERNAME}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dbnet

  webmessenger:
    build: .
    image: messenger-back
    container_name: msgr
    networks:
      - dbnet
    ports:
      - "8080:8080"
    depends_on:
      - postgres

networks:
  dbnet:
    driver: bridge

volumes:
  postgres-data:

