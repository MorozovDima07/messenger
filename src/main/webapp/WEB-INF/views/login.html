<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - Messenger</title>
    <link th:href="@{/static/site.css}" rel="stylesheet"/>
</head>
<body>
<div class="container container-reg">
    <p class="h1-reg">Войти в аккаунт</p>
    <div th:if="${param.error}" class="error">Неверный email или пароль</div>
    <div th:if="${param.logout}" class="info">Вы вышли из аккаунта</div>
    <form th:action="@{/login}" method="post" class="ul-reg">
        <ul>
            <li class="list-group-item item-reg">
                Email<input type="email" name="username" class="input-reg" placeholder="Введите Ваш Email" required/>
            </li>
            <li class="list-group-item item-reg">
                Пароль<input type="password" name="password" class="input-reg" placeholder="Введите Ваш Пароль" required/>
            </li>
        </ul>
        <div class="btn-group-two-equal-btns">
            <a th:href="@{/register}" class="btn-reg">Зарегистрироваться</a>
            <button type="submit" class="btn-reg">Войти</button>
        </div>
    </form>
</div>
</body>
</html>
