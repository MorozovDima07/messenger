<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Direct Settings - Messenger</title>
    <link th:href="@{/static/site.css}" rel="stylesheet"/>
</head>
<body>
<header>
    <th:block th:replace="~{fragments/header :: left-nav('direct')}"></th:block>
    <th:block th:replace="~{fragments/header :: right-nav(${contact.username}, ${chat != null ? '/direct?id=' + chat.id : null})}"></th:block>
</header>
<div class="container container-chats">
    <th:block th:replace="~{fragments/chat-list :: chat-list(${chats})}"></th:block>
    <div class="chat-set">
        <div class="main">
            <div class="div-messages">
                <ul class="messages">
                    <li th:each="message : ${messages}" th:class="${message.userSend} ? 'message user-send' : 'message message-with-ava'">
                        <div class="message-avatar" th:if="${!message.userSend}">
                            <div class="circleSmallAvatar">
                                <img th:if="${message.userAvatar != null}" th:src="@{${message.userAvatar}}" alt="Avatar"/>
                                <img th:unless="${message.userAvatar != null}" th:src="@{/static/icons/user.svg}" alt="Default Avatar"/>
                            </div>
                        </div>
                        <div th:class="${message.userSend} ? 'message-without-ava' : 'message-with-ava-files'">
                            <div class="user-name" th:text="${message.senderUsername}"></div>
                            <span th:text="${message.content}"></span>
                            <div class="file-list" th:if="${message.files != null and !message.files.isEmpty()}">
                                <a th:each="file : ${message.files}" th:href="@{/file/{id}(id=${file.id})}" th:text="${file.fileName}" class="file-chip"></a>
                            </div>
                            <div class="date-last-mess mess-date">
                                <img th:if="${message.read}" th:src="@{/static/icons/read.svg}"/>
                                <img th:if="${!message.read}" th:src="@{/static/icons/unread.svg}"/>
                                <p th:text="${message.date}"></p>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>
            <div class="send-message">
                <form th:action="@{/chats/{id}/send(id=${chat.id})}" method="post" enctype="multipart/form-data" class="chat-send" id="chatSendForm">
                    <label class="chat-list-item chat-list-item-sendfile">
                        <img th:src="@{/static/icons/attach.svg}" class="attach-icon"/>
                        <input type="file" name="tempFiles" multiple style="display: none;" onchange="addFiles(this)"/>
                    </label>
                    <div class="message-input-wrapper">
                        <input type="text" name="content" class="input-mess" placeholder="Текст в поле ввода"/>
                        <div class="file-preview" id="filePreview"></div>
                    </div>
                    <button type="submit" class="chat-list-item chat-list-item-sendmess">
                        <img th:src="@{/static/icons/send.svg}"/>
                    </button>
                </form>
            </div>
        </div>
        <div class="add-set">
            <div class="ava">
                <div class="circleBigAvatar">
                    <img th:if="${contact.avatarPath != null}" th:src="@{${contact.avatarPath}}" alt="Avatar"/>
                    <img th:unless="${contact.avatarPath != null}" th:src="@{/static/icons/user.svg}" alt="Default Avatar"/>
                </div>
            </div>
            <div class="cont-info cont-info-set">
                <li class="cont-name" th:text="${contact.username}"></li>
            </div>
            <ul class="settings">
                <li class="li-setting"><img th:src="@{/static/icons/email.svg}"/><div class="setting-text" th:text="${contact.email}"></div></li>
                <li class="setting">
                    <a th:href="@{/direct/{id}/info(id=${chat.id})}" class="a-setting">
                        <img th:src="@{/static/icons/info.svg}"/>
                        <div class="setting-text">Информация о пользователе</div>
                    </a>
                </li>
                <li class="setting">
                    <form th:action="@{/direct/{id}/toggle-notifications(id=${chat.id})}" method="post" style="display: inline;">
                        <button type="submit" class="a-setting" style="background: none; border: none; padding: 0; cursor: pointer;">
                            <img th:src="@{/static/icons/notifications.svg}"/>
                            <div class="setting-text">Уведомления</div>
                            <div class="circleChangeNotificationMode" th:text="${notificationsEnabled} ? 'ВКЛ' : 'ВЫКЛ'"></div>
                        </button>
                    </form>
                </li>
                <li class="setting">
                    <a th:href="@{/chat/{id}/files(id=${chat.id})}" class="a-setting">
                        <img th:src="@{/static/icons/files.svg}"/>
                        <div class="setting-text">Файлы</div>
                    </a>
                </li>
                <li class="setting">
                    <a th:href="@{/direct/{id}/share(id=${chat.id})}" class="a-setting">
                        <img th:src="@{/static/icons/share.svg}"/>
                        <div class="setting-text">Поделиться контактом</div>
                    </a>
                </li>
                <li class="setting">
                    <a th:href="@{/direct/{id}/delete(id=${chat.id})}" class="a-setting">
                        <img th:src="@{/static/icons/trash.svg}"/>
                        <div class="setting-text">Удалить контакт</div>
                    </a>
                </li>
                <li class="setting">
                    <form th:action="@{/direct/{id}/block(id=${chat.id})}" method="post" class="a-setting">
                        <img th:src="@{/static/icons/block.svg}"/>
                        <button type="submit" class="setting-text">Заблокировать</button>
                    </form>
                </li>
                <li class="setting" th:if="${currentMember != null}">
                    <a th:if="${currentMember.isAdmin}" th:href="@{/chats/{id}/delete(id=${chat.id})}" class="a-setting">
                        <img th:src="@{/static/icons/trash.svg}"/>
                        <div class="setting-text">Удалить чат</div>
                    </a>
                    <a th:unless="${currentMember.isAdmin}" th:href="@{/group/{id}/leave(id=${chat.id})}" class="a-setting">
                        <img th:src="@{/static/icons/leave.svg}"/>
                        <div class="setting-text">Покинуть чат</div>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</div>
<script th:inline="javascript">
    let accumulatedFiles = [];

    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('chatSendForm');
        form.addEventListener('submit', function(event) {
            const content = document.querySelector('.input-mess').value.trim();
            if (!content && accumulatedFiles.length === 0) {
                event.preventDefault();
                return;
            }
            const dataTransfer = new DataTransfer();
            accumulatedFiles.forEach(file => dataTransfer.items.add(file));
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.name = 'files';
            fileInput.multiple = true;
            fileInput.files = dataTransfer.files;
            fileInput.style.display = 'none';
            form.appendChild(fileInput);
        });
    });

    function addFiles(input) {
        const newFiles = Array.from(input.files);
        accumulatedFiles = accumulatedFiles.concat(newFiles);
        updateFilePreview();
        input.value = '';
        input.parentElement.querySelector('.attach-icon').style.opacity = '1';
    }

    function updateFilePreview() {
        const filePreview = document.getElementById('filePreview');
        filePreview.innerHTML = '';
        accumulatedFiles.forEach(file => {
            const fileName = file.name;
            const fileDiv = document.createElement('div');
            fileDiv.className = 'file-preview-item';
            fileDiv.innerHTML = `
                <span class="file-name">${fileName}</span>
                <span class="file-remove" onclick="removeFile('${fileName}')">✕</span>
            `;
            filePreview.appendChild(fileDiv);
        });
        const attachIcon = document.querySelector('.attach-icon');
        attachIcon.style.opacity = accumulatedFiles.length > 0 ? '1' : '0.5';
    }

    function removeFile(fileName) {
        accumulatedFiles = accumulatedFiles.filter(file => file.name !== fileName);
        updateFilePreview();
    }
</script>
</body>
</html>
