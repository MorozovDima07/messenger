<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>New Chat - Messenger</title>
    <link th:href="@{/static/site.css}" rel="stylesheet"/>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css"/>
    <meta name="user-email" th:content="${userEmail}"/>
    <th:block th:replace="~{fragments/header :: head}"></th:block>
</head>
<body>
<header>
    <th:block th:replace="~{fragments/header :: left-nav('all')}"></th:block>
    <th:block th:replace="~{fragments/header :: right-nav('Новый чат', null)}"></th:block>
</header>
<div class="container container-chats">
    <th:block th:replace="~{fragments/chat-list :: chat-list(${chatsPage.content}, 'ALL')}"></th:block>
    <div class="chat">
        <div class="new-chat-container">
            <p class="h1-reg">Создать новый чат</p>
            <div class="chat-type-selector">
                <button id="directChatBtn" class="btn btn-reg" onclick="showDirectForm()">Личный чат</button>
                <button id="groupChatBtn" class="btn btn-reg" onclick="showGroupForm()">Групповой чат</button>
            </div>
            <div th:if="${error}" th:text="${error}" class="error"></div>
            <div id="directChatForm" class="chat-form" style="display: none;">
                <form th:action="@{/chats/new/direct}" method="post" th:object="${DirectChatDTO}" class="ul-reg" id="directChatForm">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                    <ul>
                        <li class="list-group-item item-reg">
                            Email пользователя
                            <input type="email" name="email" id="emailInput" class="input-reg" placeholder="Введите email" required/>
                            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></div>
                        </li>
                    </ul>
                    <div class="btn-group">
                        <button type="submit" class="btn btn-reg">Создать</button>
                    </div>
                </form>
            </div>

            <div id="groupChatForm" class="chat-form" style="display: none;">
                <form th:action="@{/chats/new/group}" method="post" th:object="${GroupChatDTO}" class="ul-reg" id="groupChatForm">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                    <ul>
                        <li class="list-group-item item-reg">
                            Название группы
                            <input type="text" name="name" class="input-reg" placeholder="Введите название группы" required/>
                            <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error"></div>
                        </li>
                        <li class="list-group-item item-reg">
                            Участники
                            <div id="emailFields">
                                <input type="email" name="emails" class="input-reg" placeholder="Введите email участника"/>
                            </div>
                            <div th:if="${#fields.hasErrors('emails')}" th:errors="*{emails}" class="error"></div>
                            <button type="button" class="btn btn-reg" onclick="addEmailField()">Добавить участника</button>
                        </li>
                    </ul>
                    <div class="btn-group">
                        <button type="submit" class="btn btn-reg">Создать</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    function showDirectForm() {
        document.getElementById("directChatForm").style.display = "block";
        document.getElementById("groupChatForm").style.display = "none";
        document.getElementById("directChatBtn").classList.add("active-btn");
        document.getElementById("groupChatBtn").classList.remove("active-btn");
    }

    function showGroupForm() {
        document.getElementById("directChatForm").style.display = "none";
        document.getElementById("groupChatForm").style.display = "block";
        document.getElementById("directChatBtn").classList.remove("active-btn");
        document.getElementById("groupChatBtn").classList.add("active-btn");
    }

    function addEmailField() {
        const emailFields = document.getElementById("emailFields");
        const newField = document.createElement("input");
        newField.type = "email";
        newField.name = "emails";
        newField.className = "input-reg";
        newField.placeholder = "Введите email участника";
        emailFields.appendChild(newField);
        applyAutocomplete(newField);
    }

    function applyAutocomplete(element) {
        $(element).autocomplete({
            source: function(request, response) {
                $.ajax({
                    url: "/api/users/search",
                    data: { query: request.term, chatType: 'group' },
                    success: function(data) {
                        response(data);
                    },
                    error: function() {
                        response([]);
                    }
                });
            },
            minLength: 2
        });
    }

    $(document).ready(function() {
        applyAutocomplete("#emailFields input[name='emails']");
    });
</script>
</body>
</html>
